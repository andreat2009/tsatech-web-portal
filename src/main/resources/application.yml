server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
      tracking-modes: cookie
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    certificate: ${SERVER_SSL_CERT:/etc/tls/tls.crt}
    certificate-private-key: ${SERVER_SSL_KEY:/etc/tls/tls.key}

spring:
  servlet:
    multipart:
      max-file-size: ${WEB_MEDIA_MAX_MULTIPART_SIZE:6MB}
      max-request-size: ${WEB_MEDIA_MAX_MULTIPART_REQUEST_SIZE:30MB}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  application:
    name: web-portal
  thymeleaf:
    cache: false
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:https://keycloak-platform.${APP_BASE_DOMAIN:apps.example.invalid}/realms/master}
            authorization-uri: ${KEYCLOAK_AUTHORIZATION_URI:}
            token-uri: ${KEYCLOAK_TOKEN_URI:}
            user-info-uri: ${KEYCLOAK_USERINFO_URI:}
            jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:web-portal}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

app:
  gateway-base-url: ${GATEWAY_BASE_URL:http://api-gateway.${APP_NAMESPACE:ecommerce}.svc.cluster.local:8443}
  currency: ${APP_CURRENCY:EUR}
  store-url: ${APP_STORE_URL:https://web-portal-${APP_NAMESPACE:ecommerce}.${APP_BASE_DOMAIN:apps.example.invalid}}
  keycloak-backchannel-base-url: ${KEYCLOAK_BACKCHANNEL_BASE_URL:http://keycloak.${PLATFORM_NAMESPACE:platform}.svc.cluster.local}
  keycloak-account-url: ${KEYCLOAK_ACCOUNT_URL:https://keycloak-platform.${APP_BASE_DOMAIN:apps.example.invalid}/realms/master/account}
  keycloak-admin-base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://keycloak.${PLATFORM_NAMESPACE:platform}.svc.cluster.local}
  keycloak-admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
  keycloak-admin-username: ${KEYCLOAK_ADMIN_USER:admin}
  keycloak-admin-password: ${KEYCLOAK_ADMIN_PASS:}
  keycloak-registration-role: ${KEYCLOAK_REGISTRATION_ROLE:USER}

management:
  endpoints:
    web:
      exposure:
        include: health,info
