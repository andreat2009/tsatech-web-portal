<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Custom Fields</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="container admin">
    <div class="page-header">
        <h1>Custom Fields</h1>
        <a class="btn btn-primary" th:href="@{/admin/custom-fields/new}">New field</a>
    </div>

    <div class="card table-wrap">
        <table>
            <thead>
            <tr>
                <th>Code</th>
                <th>Label</th>
                <th>Type</th>
                <th>Scope</th>
                <th>Required</th>
                <th>Active</th>
                <th>Persist</th>
                <th>Sort</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${customFields == null or customFields.isEmpty()}">
                <td colspan="9" class="muted">No custom fields configured.</td>
            </tr>
            <tr th:each="field : ${customFields}">
                <td th:text="${field.code}">CODE</td>
                <td th:text="${field.label}">Label</td>
                <td th:text="${field.fieldType}">TEXT</td>
                <td th:text="${field.fieldScope}">CHECKOUT</td>
                <td th:text="${field.required}">false</td>
                <td th:text="${field.active}">true</td>
                <td th:text="${field.persistForCustomer}">false</td>
                <td th:text="${field.sortOrder}">10</td>
                <td class="actions inline-actions">
                    <a class="btn" th:href="@{|/admin/custom-fields/${field.id}/edit|}">Edit</a>
                    <form th:action="@{|/admin/custom-fields/${field.id}/delete|}" method="post" style="display:inline;">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="btn" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
