<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="#{admin.customers.title}">Admin Clienti</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="container admin">
    <h1 th:text="#{admin.customers.title}">Clienti</h1>
    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Email</th>
                <th th:text="#{common.name}">Nome</th>
                <th th:text="#{common.lastname}">Cognome</th>
                <th>Customer group</th>
                <th th:text="#{common.active}">Attivo</th>
                <th th:text="#{common.actions}">Azioni</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="customer : ${customers}">
                <td th:text="${customer.id}">1</td>
                <td th:text="${customer.email}">mail@example.com</td>
                <td th:text="${customer.firstName}">Nome</td>
                <td th:text="${customer.lastName}">Cognome</td>
                <td>
                    <form th:action="@{/admin/customers/{id}/group(id=${customer.id})}" method="post" class="inline-form">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="text" name="customerGroupCode" th:value="${customer.customerGroupCode}" placeholder="RETAIL" />
                        <button class="btn btn-small" type="submit">Save group</button>
                    </form>
                </td>
                <td th:text="${customer.active}">true</td>
                <td class="muted" th:text="${customer.keycloakUserId}">keycloak</td>
            </tr>
        </tbody>
    </table>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
