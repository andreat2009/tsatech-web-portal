<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${formTitle}">Payment Method</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="container admin">
    <div class="page-header">
        <h1 th:text="${formTitle}">Payment Method</h1>
        <a class="btn" th:href="@{/admin/payment-methods}">Back to list</a>
    </div>

    <form class="form" th:action="${formAction}" method="post" th:object="${paymentMethod}">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="field-grid two">
            <div class="field">
                <label>Code</label>
                <input th:field="*{code}" required />
            </div>
            <div class="field">
                <label>Display name</label>
                <input th:field="*{displayName}" required />
            </div>
        </div>

        <div class="field-grid two">
            <div class="field">
                <label>Provider</label>
                <select th:field="*{provider}">
                    <option th:each="provider : ${providerOptions}" th:value="${provider}" th:text="${provider}">OFFLINE</option>
                </select>
            </div>
            <div class="field">
                <label>Payment flow</label>
                <select th:field="*{paymentFlow}">
                    <option th:each="flow : ${paymentFlowOptions}" th:value="${flow}" th:text="${flow}">OFFLINE</option>
                </select>
            </div>
        </div>

        <div class="field-grid two">
            <div class="field">
                <label>Sort order</label>
                <input type="number" th:field="*{sortOrder}" />
            </div>
            <div class="field">
                <label>Active</label>
                <select th:field="*{active}">
                    <option th:value="true">true</option>
                    <option th:value="false">false</option>
                </select>
            </div>
        </div>

        <div class="field">
            <label>Description</label>
            <textarea th:field="*{description}" rows="4"></textarea>
        </div>

        <div class="actions space-top">
            <button class="btn btn-primary" type="submit" th:text="#{common.save}">Save</button>
            <a class="btn" th:href="@{/admin/payment-methods}" th:text="#{common.cancel}">Cancel</a>
        </div>
    </form>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
