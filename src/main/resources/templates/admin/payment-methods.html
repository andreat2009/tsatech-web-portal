<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Payment Methods</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="container admin">
    <div class="page-header">
        <h1>Payment Methods</h1>
        <a class="btn btn-primary" th:href="@{/admin/payment-methods/new}">New payment method</a>
    </div>

    <div class="card table-wrap">
        <table>
            <thead>
            <tr>
                <th>Code</th>
                <th>Display name</th>
                <th>Provider</th>
                <th>Flow</th>
                <th>Active</th>
                <th>Sort</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${paymentMethods == null or paymentMethods.isEmpty()}">
                <td colspan="7" class="muted">No payment methods configured.</td>
            </tr>
            <tr th:each="method : ${paymentMethods}">
                <td th:text="${method.code}">paypal</td>
                <td th:text="${method.displayName}">PayPal</td>
                <td th:text="${method.provider}">PAYPAL</td>
                <td th:text="${method.paymentFlow}">REDIRECT</td>
                <td th:text="${method.active}">true</td>
                <td th:text="${method.sortOrder}">10</td>
                <td class="actions inline-actions">
                    <a class="btn" th:href="@{|/admin/payment-methods/${method.id}/edit|}">Edit</a>
                    <form th:action="@{|/admin/payment-methods/${method.id}/delete|}" method="post" style="display:inline;">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="btn" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
