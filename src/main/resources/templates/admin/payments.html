<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="#{admin.payments.title}">Admin Pagamenti</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="container admin">
    <div class="page-header">
        <h1 th:text="#{admin.payments.title}">Pagamenti</h1>
        <a class="btn" th:href="@{/admin/payment-methods}">Manage payment methods</a>
    </div>

    <div class="card section-pad" th:if="${reconciled}">
        <strong>Reconciliation completed.</strong>
    </div>
    <div class="card section-pad" th:if="${refunded}">
        <strong>Refund saved.</strong>
    </div>
    <div class="card section-pad" th:if="${error != null}">
        <strong th:text="'Operation failed: ' + ${error}">Operation failed</strong>
    </div>

    <div class="card table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th th:text="#{common.order}">Order</th>
                <th th:text="#{common.amount}">Importo</th>
                <th>Refunded</th>
                <th th:text="#{common.currency}">Valuta</th>
                <th th:text="#{common.status}">Status</th>
                <th th:text="#{common.provider}">Provider</th>
                <th>Provider status</th>
                <th>Last sync</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${payments == null or payments.isEmpty()}">
                <td colspan="10" class="muted">No payments found.</td>
            </tr>
            <tr th:each="payment : ${payments}">
                <td th:text="${payment.id}">1</td>
                <td th:text="${payment.orderId}">1</td>
                <td th:text="${payment.amount != null ? #numbers.formatDecimal(payment.amount, 1, 'POINT', 2, 'POINT') : '0.00'}">0.00</td>
                <td th:text="${payment.refundedAmount != null ? #numbers.formatDecimal(payment.refundedAmount, 1, 'POINT', 2, 'POINT') : '0.00'}">0.00</td>
                <td th:text="${payment.currency}">EUR</td>
                <td th:text="${payment.status}">NEW</td>
                <td th:text="${payment.provider}">manual</td>
                <td th:text="${payment.providerStatus}">provider status</td>
                <td th:text="${payment.lastProviderSyncAt != null ? payment.lastProviderSyncAt : '-'}">-</td>
                <td class="actions">
                    <form th:action="@{|/admin/payments/${payment.id}/reconcile|}" method="post" style="margin-bottom:0.5rem;">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="btn" type="submit">Reconcile</button>
                    </form>
                    <form th:action="@{|/admin/payments/${payment.id}/refund|}" method="post" class="form-inline-grid">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="number" step="0.01" name="amount" placeholder="Amount" />
                        <input type="text" name="reason" placeholder="Reason" />
                        <button class="btn" type="submit">Refund</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
