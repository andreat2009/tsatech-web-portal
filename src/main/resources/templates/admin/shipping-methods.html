<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Shipping Methods</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container admin">
    <div class="page-header">
        <h1>Shipping Methods</h1>
        <a class="btn btn-primary" th:href="@{/admin/shipping-methods/new}">New shipping method</a>
    </div>

    <div class="alerts" th:if="${saved or updated or deleted or error != null}">
        <p class="alert-success" th:if="${saved}">Shipping method saved.</p>
        <p class="alert-success" th:if="${updated}">Shipping method updated.</p>
        <p class="alert-success" th:if="${deleted}">Shipping method deleted.</p>
        <p class="alert-error" th:if="${error != null}">Shipping method operation failed. Check the code is unique and try again.</p>
    </div>

    <div class="card table-wrap">
        <table>
            <thead>
            <tr>
                <th>Code</th>
                <th>Label</th>
                <th>Cost</th>
                <th>Enabled</th>
                <th>Sort</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${shippingMethods == null or shippingMethods.isEmpty()}">
                <td colspan="6" class="muted">No shipping methods configured.</td>
            </tr>
            <tr th:each="method : ${shippingMethods}">
                <td th:text="${method.code}">FLAT</td>
                <td th:text="${method.label}">Standard shipping</td>
                <td th:text="${method.cost}">8.00</td>
                <td th:text="${method.enabled}">true</td>
                <td th:text="${method.sortOrder}">1</td>
                <td class="actions inline-actions">
                    <a class="btn" th:href="@{|/admin/shipping-methods/${method.id}/edit|}">Edit</a>
                    <form th:action="@{|/admin/shipping-methods/${method.id}/delete|}" method="post" style="display:inline;">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="btn" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
