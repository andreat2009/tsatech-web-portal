<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="#{blog.list.title}">Blog</title>
    <th:block th:replace="~{fragments/head :: assets}"></th:block>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main id="main-content" tabindex="-1" class="container">
    <section class="card section-pad">
        <h1 th:text="#{blog.list.heading}">Blog</h1>
        <div class="blog-list" data-paginate-collection="true" data-paginate="10" data-pagination-item=".list-divider">
            <div th:each="post : ${posts}" class="list-divider">
                <h3><a th:href="@{/news/{slug}(slug=${post.slug})}" th:text="${post.title}">Title</a></h3>
                <p th:text="${post.excerpt}">Excerpt</p>
                <small th:text="${post.publishedAt}">2026-01-01</small>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(posts)}" th:text="#{blog.list.empty}">No articles published.</p>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
